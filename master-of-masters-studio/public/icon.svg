<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Chassis -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#334155" stroke-width="6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Glowing Soundwave Crest -->
  <path d="M 96 256 Q 136 170 176 256 T 256 256 T 336 256 T 416 256" fill="none" stroke="url(#red)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Master Trophy Emblem -->
  <g transform="translate(136, 120) scale(0.48)">
    <path d="M120 40 L380 40 L340 280 C340 370 270 430 250 440 C230 430 160 370 160 280 Z" fill="url(#gold)" filter="url(#glow)"/>
    <path d="M120 80 C40 90 40 220 140 240 L145 200 C80 180 80 120 125 110 Z" fill="url(#gold)"/>
    <path d="M380 80 C460 90 460 220 360 240 L355 200 C420 180 420 120 375 110 Z" fill="url(#gold)"/>
    <!-- Base -->
    <path d="M220 440 L280 440 L310 500 L190 500 Z" fill="url(#gold)"/>
  </g>

  <!-- 64-BIT PRO BADGE -->
  <rect x="146" y="380" width="220" height="46" rx="23" fill="#0f172a" stroke="url(#gold)" stroke-width="3"/>
  <text x="256" y="411" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="url(#gold)" text-anchor="middle" letter-spacing="3">64-BIT STUDIO</text>
</svg>
